# Manual/CI build for the web image. Context MUST be the repo root (npm workspaces) — run from
# the repo root: gcloud builds submit --config=apps/web/cloudbuild.yaml --substitutions=_API_URL=<real API URL> .
# _API_URL gets baked into the JS bundle at build time (Vite env vars aren't runtime-configurable)
# — see apps/web/Dockerfile.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - apps/web/Dockerfile
      - '--build-arg'
      - VITE_API_BASE_URL=${_API_URL}
      - '--build-arg'
      - VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - '--build-arg'
      - VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - '--build-arg'
      - VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - '--build-arg'
      - VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - '--build-arg'
      - VITE_ALLOWED_EMAIL_DOMAIN=${_ALLOWED_EMAIL_DOMAIN}
      - '-t'
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - taskapp-web
      - --image=${_IMAGE}
      - --region=us-central1
      - --project=testing-sujeeth
      - --quiet
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/testing-sujeeth/taskapp-repo/web:latest
  _API_URL: https://taskapp-api-430674734301.us-central1.run.app
  _FIREBASE_API_KEY: 'AIzaSyCA6Sgz5QUV9eWgeKTXwaXDXrvU7jJAfOg'
  _FIREBASE_AUTH_DOMAIN: 'testing-sujeeth.firebaseapp.com'
  _FIREBASE_PROJECT_ID: 'testing-sujeeth'
  _FIREBASE_APP_ID: '1:430674734301:web:e666a95e788e8d6d5e7f34'
  _ALLOWED_EMAIL_DOMAIN: econz.net
options:
  logging: CLOUD_LOGGING_ONLY
