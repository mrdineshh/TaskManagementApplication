<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management</title>
    <!-- Studio Desk direction (docs/10-OPEN-DECISIONS.md §M5): Fraunces for headings, Karla
         for body/UI chrome. preconnect first since these block first paint otherwise. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme on load
      // (docs/10-OPEN-DECISIONS.md §L) — mirrors the resolution logic in
      // src/lib/theme/useTheme.ts exactly (localStorage 'taskapp.theme', falling back to the
      // OS preference).
      (function () {
        var pref = localStorage.getItem('taskapp.theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
