# Manual/CI build for the API image. Context MUST be the repo root (npm workspaces) — run from
# the repo root: gcloud builds submit --config=apps/api/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']

  # Deploy to Cloud Run with all production env vars explicitly set.
  # Using a shell step avoids YAML dict-parsing issues with comma-separated values.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy taskapp-api \
          --image="${_IMAGE}" \
          --region=us-central1 \
          --project=testing-sujeeth \
          --quiet \
          --set-env-vars="DATABASE_URL=${_DATABASE_URL}" \
          --update-env-vars="JWT_ACCESS_SECRET=${_JWT_ACCESS_SECRET}" \
          --update-env-vars="JWT_REFRESH_SECRET=${_JWT_REFRESH_SECRET}" \
          --update-env-vars="JWT_ACCESS_TTL=15m" \
          --update-env-vars="JWT_REFRESH_TTL=7d" \
          --update-env-vars="ALLOWED_EMAIL_DOMAIN=econz.net" \
          --update-env-vars="AUTH_PROVIDERS=google" \
          --update-env-vars="NODE_ENV=production" \
          --update-env-vars="FIREBASE_PROJECT_ID=testing-sujeeth" \
          --update-env-vars="GCS_ATTACHMENTS_BUCKET=taskapp-attachments-testing-sujeeth"
        # ALLOWED_ORIGIN is set last since it contains a comma
        gcloud run services update taskapp-api \
          --region=us-central1 \
          --project=testing-sujeeth \
          --quiet \
          --update-env-vars="^||^ALLOWED_ORIGIN=https://pulse.econz.cloud||https://taskapp-web-jnimlvkvmq-uc.a.run.app"

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/testing-sujeeth/taskapp-repo/api:latest
  _DATABASE_URL: postgresql://postgres:TaskAppSecureDb2026!@localhost/taskmanagement?host=/cloudsql/testing-sujeeth:us-central1:taskapp-db
  _JWT_ACCESS_SECRET: TaskAppJwtAccessSecretKeyProduction2026!SecureKey
  _JWT_REFRESH_SECRET: TaskAppJwtRefreshSecretKeyProduction2026!SecureKey

options:
  logging: CLOUD_LOGGING_ONLY
