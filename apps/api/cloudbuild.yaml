# Manual/CI build for the API image. Context MUST be the repo root (npm workspaces) — run from
# the repo root: gcloud builds submit --config=apps/api/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/econz-task-management-app/taskapp/api:latest
options:
  logging: CLOUD_LOGGING_ONLY
