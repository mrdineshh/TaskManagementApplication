# Manual/CI build for the API image. Context MUST be the repo root (npm workspaces) — run from
# the repo root: gcloud builds submit --config=apps/api/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']

  # Deploy to Cloud Run. All env vars set via a single --update-env-vars call
  # using ^||^ as the multi-value separator to avoid mixing set/update flags.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy taskapp-api \
          --image="${_IMAGE}" \
          --region=us-central1 \
          --project=testing-sujeeth \
          --quiet \
          --update-env-vars="^||^DATABASE_URL=${_DATABASE_URL}||JWT_ACCESS_SECRET=${_JWT_ACCESS_SECRET}||JWT_REFRESH_SECRET=${_JWT_REFRESH_SECRET}||JWT_ACCESS_TTL=15m||JWT_REFRESH_TTL=7d||ALLOWED_EMAIL_DOMAIN=econz.net||AUTH_PROVIDERS=google||NODE_ENV=production||FIREBASE_PROJECT_ID=testing-sujeeth||GCS_ATTACHMENTS_BUCKET=taskapp-attachments-testing-sujeeth||CORS_ALLOWED_ORIGINS=https://pulse.econz.cloud,https://taskapp-web-jnimlvkvmq-uc.a.run.app||ALLOWED_ORIGIN=https://pulse.econz.cloud"

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/testing-sujeeth/taskapp-repo/api:latest
  _DATABASE_URL: postgresql://postgres:TaskAppSecureDb2026!@localhost/taskmanagement?host=/cloudsql/testing-sujeeth:us-central1:taskapp-db
  _JWT_ACCESS_SECRET: TaskAppJwtAccessSecretKeyProduction2026!SecureKey
  _JWT_REFRESH_SECRET: TaskAppJwtRefreshSecretKeyProduction2026!SecureKey

options:
  logging: CLOUD_LOGGING_ONLY
